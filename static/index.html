<!DOCTYPE html>
<html>
<head>
    <title>SimChat</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            display: flex;
            width: 80%;
            max-width: 900px;
            gap: 20px;
        }

        /* Left column: input area */
        #inputSection {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* sticks input at the bottom */
            height: 500px; /* same as chatbox */
        }

        #messageInput {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            box-sizing: border-box;
        }

        #sendBtn {
            padding: 10px;
            margin-top: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        /* Right column: chat messages */
        #chatbox {
            flex: 2;
            height: 500px;
            border: 1px solid #ccc;
            background: white;
            overflow-y: auto;
            padding: 10px;
        }

        .user {
            text-align: right;
            color: blue;
            margin: 5px;
        }

        .bot {
            text-align: left;
            color: green;
            margin: 5px;
        }
    </style>
</head>
<body>
<h2>Let's talk with SimChat</h2>
<div class="container">
    <!-- Input on the left -->
    <div id="inputSection">
        <input type="text" id="messageInput" placeholder="Type a message..." />
        <button id="sendBtn" onclick="sendMessage()">Send</button>
    </div>

    <!-- Chatbox on the right -->
    <div id="chatbox"></div>
</div>

<script>
async function sendMessage() {
    const input = document.getElementById("messageInput");
    const message = input.value.trim();
    if (!message) return;

    const chatbox = document.getElementById("chatbox");

    // Show user message
    chatbox.innerHTML += `<div class="user">You: ${message}</div>`;

    input.value = "";

    // Send to backend (adjust URL if needed)
    const response = await fetch("http://127.0.0.1:8000/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: message })
    });

    const data = await response.json();

    // Show bot response
    chatbox.innerHTML += `<div class="bot">SimChat: ${data.response}</div>`;

    // Scroll chatbox to bottom
    chatbox.scrollTop = chatbox.scrollHeight;

// Check if backend responded with a bye message
        if (data.response.toLowerCase().includes("bye")) {
            // Disable input to prevent more typing
            input.disabled = true;
            // Refresh page after short delay
            setTimeout(() => {
                window.location.reload();
            }, 2000); // 2 seconds
        }
    }
// Display welcome message when page loads
window.onload = function() {
    chatbox.innerHTML += `<div class="bot">SimChat: Hello! I'm SimChat - a simple chatbot...you can ask me questions - if I know the answer, I will definitely tell you!!! If you are done chatting, please type "bye". So, let's get started... </div>`;
};

</script>

</body>
</html>
